syntax = "proto3";

package keyvalue;

// Serviço de aplicação 2: armazenamento chave-valor em memória (com estado)
service KeyValue {
	rpc Put (KeyValueMsg) returns (StatusMsg) {}
	rpc Get (KeyMsg) returns (ValueMsg) {}
	rpc Delete (KeyMsg) returns (StatusMsg) {}
	rpc List (ListRequest) returns (KeyValueList) {}
}

message KeyMsg {
	string key = 1;
}

message KeyValueMsg {
	string key = 1;
	string value = 2;
}

message ValueMsg {
	bool found = 1;
	string value = 2;
}

message StatusMsg {
	string status = 1;   // OK ou NOK
}

message ListRequest {}

message KeyValueList {
	repeated KeyValueMsg items = 1;
}
